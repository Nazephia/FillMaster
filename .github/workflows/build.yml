name: build
on: workflow_dispatch
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name FillMaster FillMaster.py
      - uses: actions/upload-artifact@v4
        with:
          name: FillMaster-${{ runner.os }}
          path: dist/FillMaster*
