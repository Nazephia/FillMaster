name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name FillMaster FillMaster.py
      - name: Empaquetar binario de Linux
        if: runner.os == 'Linux'
        run: tar czf dist/FillMaster-linux.tar.gz -C dist FillMaster
      - uses: actions/upload-artifact@v7
        with:
          name: FillMaster-${{ runner.os }}
          path: |
            dist/FillMaster.exe
            dist/FillMaster-linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}